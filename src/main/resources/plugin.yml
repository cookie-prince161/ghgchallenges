name: ChallengePlugin
version: '1.0'
main: de.elias.challengeplugin.ChallengePlugin
api-version: '1.20'
authors: [Elias]
description: Ein modulares Challenge-Plugin mit GUI, Timer und WorldReset.

commands:
  challenges:
    description: Öffnet das Challenge-Hauptmenü.
    aliases: [challenge, c, menu]
    permission: challengeplugin.admin
    permission-message: Du hast keine Berechtigung für diesen Befehl.
  timer:
    description: Steuert den Challenge-Timer und dessen Einstellungen.
    aliases: [t]
    permission: challengeplugin.admin
    permission-message: Du hast keine Berechtigung für diesen Befehl.
  worldreset:
    description: Generiert eine neue Welt mit neuem Seed und teleportiert alle Spieler.
    aliases: [reset, newworld]
    permission: challengeplugin.admin
    permission-message: Du hast keine Berechtigung für diesen Befehl.

permissions:
  challengeplugin.admin:
    description: Erlaubt die Steuerung von Challenges, Timern und Welt-Resets.
    default: op
